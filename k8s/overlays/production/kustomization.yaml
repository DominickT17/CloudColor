apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: cloudcolor-web
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: dominickt1703/cloudcolor-redesii:sha-REEMPLAZAR
  - target:
      kind: Job
      name: sql-init
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: dominickt1703/cloudcolor-redesii:db-init-sha-REEMPLAZAR
  - target:
      kind: Job
      name: user-init
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: dominickt1703/cloudcolor-redesii:user-init-sha-REEMPLAZAR
  - target:
      kind: Ingress
      name: cloudcolor-web
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          cert-manager.io/cluster-issuer: letsencrypt-prod
      - op: replace
        path: /spec/rules/0/host
        value: cloudcolor.tu-dominio.invalid
      - op: add
        path: /spec/tls
        value:
          - hosts: [cloudcolor.tu-dominio.invalid]
            secretName: cloudcolor-tls
