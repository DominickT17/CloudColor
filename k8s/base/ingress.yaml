apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudcolor-web
spec:
  ingressClassName: nginx
  rules:
    - host: cloudcolor.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudcolor-web
                port:
                  number: 80
