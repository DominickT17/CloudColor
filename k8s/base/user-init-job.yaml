apiVersion: batch/v1
kind: Job
metadata:
  name: user-init
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: user-init
          image: dominickt1703/cloudcolor-redesii:user-init-latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: cloudcolor-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
