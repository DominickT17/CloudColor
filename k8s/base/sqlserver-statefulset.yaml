apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sqlserver
spec:
  serviceName: sqlserver
  replicas: 1
  selector:
    matchLabels:
      app: sqlserver
  template:
    metadata:
      labels:
        app: sqlserver
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 10001
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - name: sql
              containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: Developer
            - name: TZ
              value: America/Guatemala
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudcolor-secrets
                  key: MSSQL_SA_PASSWORD
            - name: SQLCMDPASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudcolor-secrets
                  key: MSSQL_SA_PASSWORD
          startupProbe:
            tcpSocket:
              port: sql
            periodSeconds: 10
            failureThreshold: 36
          readinessProbe:
            exec:
              command: ["/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost,1433", "-U", "sa", "-C", "-b", "-l", "3", "-Q", "SELECT 1"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: sql
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
