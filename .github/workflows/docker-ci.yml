name: Docker CI

on:
  push:
    branches:
      - redes/proyecto-final

permissions:
  contents: read

concurrency:
  group: cloudcolor-docker-production
  queue: max

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test deployment orchestration
        run: python3 -B -m unittest discover -s tests/CloudColor.Dokploy.Pruebas -p 'test_*.py'

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            dominickt1703/cloudcolor-redesii:latest
            dominickt1703/cloudcolor-redesii:sha-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push SQL initializer
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/sql/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            dominickt1703/cloudcolor-redesii:db-init-latest
            dominickt1703/cloudcolor-redesii:db-init-sha-${{ github.sha }}
          cache-from: type=gha,scope=db-init
          cache-to: type=gha,mode=max,scope=db-init

      - name: Build and push user initializer
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/gerente/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            dominickt1703/cloudcolor-redesii:user-init-latest
            dominickt1703/cloudcolor-redesii:user-init-sha-${{ github.sha }}
          cache-from: type=gha,scope=user-init
          cache-to: type=gha,mode=max,scope=user-init

      - name: Redeploy Dokploy after publishing
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          CLOUDCOLOR_PUBLIC_URL: ${{ vars.CLOUDCOLOR_PUBLIC_URL }}
        run: python3 scripts/dokploy/redeploy.py
